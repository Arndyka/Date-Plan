# Date-Plan: only explicitly declared settings are applied by `supabase config push`.
# Review `supabase config diff --project-ref rwdwbvnunsnampznfhyv` before applying.
project_id = "DATE-PLAN"

[auth]
site_url = "https://arndyka.github.io/Date-Plan/"
additional_redirect_urls = ["https://arndyka.github.io/Date-Plan/", "http://127.0.0.1:5173/Date-Plan/", "http://127.0.0.1:5174/Date-Plan/"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

# Load these variables from ignored .env.smtp.local before config diff/push.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(SUPABASE_SMTP_EMAIL)"
pass = "env(SUPABASE_SMTP_PASS)"
admin_email = "env(SUPABASE_SMTP_EMAIL)"
sender_name = "Our Little Date"

[auth.rate_limit]
email_sent = 10
